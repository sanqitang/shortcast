name: Test Shortcast Video Processing

on:
  workflow_dispatch:
    inputs:
      test_video_url:
        description: 'URL of long sample video'
        required: false
        default: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4'

jobs:
  process-video:
    name: Process Video & Export Short
    runs-on: macos-15  # Requires Apple Silicon runner for MLX / Metal acceleration

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download & Install Shortcast DMG
        run: |
          echo "Fetching latest Shortcast release URL..."
          DMG_URL=$(curl -s https://api.github.com/repos/mutonby/shortcast/releases/latest \
            | jq -r '.assets[] | select(.name | endswith(".dmg")) | .browser_download_url')

          curl -L -o Shortcast.dmg "$DMG_URL"
          hdiutil attach Shortcast.dmg -mountpoint /Volumes/Shortcast
          sudo cp -R /Volumes/Shortcast/Shortcast.app /Applications/
          hdiutil detach /Volumes/Shortcast
          
          # Remove Gatekeeper quarantine
          sudo xattr -dr com.apple.quarantine /Applications/Shortcast.app

      - name: Download Sample Input Video
        run: |
          mkdir -p input_video
          curl -L -o input_video/sample_long_video.mp4 "${{ github.event.inputs.test_video_url }}"
          echo "Downloaded sample video to $(pwd)/input_video/sample_long_video.mp4"

      - name: Free Up macOS Runner Disk Space
        run: |
          sudo rm -rf /Library/Developer/CoreSimulator/Profiles/Runtimes/*
          xcrun simctl erase all || true
          df -h

      
      - name: Launch Shortcast & Trigger Video Processing
        run: |
          INPUT_PATH="$(pwd)/input_video/sample_long_video.mp4"
          
          echo "1. Launching Shortcast..."
          open -a /Applications/Shortcast.app
          sleep 8  # Wait for main window to render

          echo "2. Sending File Open AppleScript sequence..."
          osascript -e "
            tell application \"Shortcast\" to activate
            delay 2
            tell application \"System Events\"
              tell process \"Shortcast\"
                -- Open file shortcut (⌘O)
                keystroke \"o\" using {command down}
                delay 2
                
                -- Open 'Go to Folder' drawer in macOS file picker (⌘⇧G)
                keystroke \"g\" using {command down, shift down}
                delay 2
                
                -- Type full video path and confirm
                keystroke \"$INPUT_PATH\"
                delay 1
                key code 36 -- Return / Enter key
                delay 2
                key code 36 -- Return / Enter key to confirm Open
              end tell
            end tell
          " || true

          echo "3. Monitoring processing (WhisperKit + Qwen 3.5 9B / Gemma 4)..."
          # Give adequate time for model download + transcription + cutting
          sleep 400

      - name: Check Shortcast Logs
        if: always()
        run: |
          log show --predicate 'process == "Shortcast"' --last 10m || true

      - name: Gather Rendered Shorts
        if: always()
        run: |
          mkdir -p ./output_shorts

          echo "Searching for generated mp4s across macOS App Sandboxes..."
          
          # Shortcast Sandbox directory
          find ~/Library/Containers/ -name "*.mp4" -exec cp {} ./output_shorts/ \; 2>/dev/null || true
          
          # Standard App Support
          find ~/Library/Application\ Support/ -name "*.mp4" -exec cp {} ./output_shorts/ \; 2>/dev/null || true
          
          # Fallback Movies / Temp paths
          find ~/Movies/ -name "*.mp4" -exec cp {} ./output_shorts/ \; 2>/dev/null || true
          find /tmp/ -name "*.mp4" -exec cp {} ./output_shorts/ \; 2>/dev/null || true

          ls -lh ./output_shorts/

      - name: Upload Processed Shorts
        uses: actions/upload-artifact@v4
        with:
          name: Shortcast-Output
          path: ./output_shorts/*.mp4
          if-no-files-found: warn
